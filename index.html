<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Responsible AI Journey Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── the hi-fi system, same values as Figma page 04 Hi-fi ───────────── */
:root{
  --ground:#EFEFEC;        /* page                                  */
  --panel:#F9F9F7;         /* working surface                       */
  --card:#FFFFFF;          /* an object you act on                  */
  --ink:#17171A;           /* filled · decisions · the AI speaking  */
  --body:#45464A;
  --mute:#7C7D82;
  --faint:#A9AAAF;
  --ghost:#C4C4BF;
  --line:#E2E2DD;          /* card edge                             */
  --line2:#E4E4DF;         /* rules, quiet edges                    */
  --div:#DADAD6;
  --dash:#CFCFC8;          /* unopened, in this column              */
  --dash2:#E0E0DA;         /* not yet — another column              */
  --walk:1.8s;          /* the rail and the search share one clock */
  --f:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:var(--f);color:var(--ink);background:var(--ground);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}

/* an app shell: the chrome stays put, the canvas scrolls inside it.
   the page itself never scrolls, so the whole interface is on screen
   however many stages the journey has. */
#root{height:100%;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
.caps{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

/* ── the three-step bar ─────────────────────────────────────────────── */
.topbar{background:#fff;padding:22px 40px 0;flex:0 0 auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stepcol{display:block;width:100%;background:none;border:0;padding:0;margin:0;
  font:inherit;color:inherit;text-align:left;cursor:default}
.stepcol.can{cursor:pointer}
.stepcol.can:hover h4{color:var(--ink)}
.stepcol.can:hover p{color:var(--body)}
.stepcol h4{margin:0 0 3px;font-size:13.5px;font-weight:500;color:var(--faint)}
.stepcol p{margin:0;font-size:13.5px;color:#BFC0C4}
.stepcol.on h4{font-weight:600;color:var(--ink)}
.stepcol.on p{color:var(--body)}
.steprule{display:grid;grid-template-columns:repeat(3,1fr);gap:0;height:2px;margin-top:14px}
.steprule i{background:var(--div)}
.steprule i.on{background:var(--ink)}

/* ── page body ──────────────────────────────────────────────────────── */
.wrap{padding:26px 40px 28px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  background:var(--panel)}
.frame{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.phdrrow{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:20px}
.phdr{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px;line-height:1.3}
.phdrsub{font-size:14px;color:var(--mute);margin:0}

.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;
  padding:12px 20px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn[disabled]{background:#E4E4DF;border-color:#E4E4DF;color:var(--faint);cursor:not-allowed}

/* ── lane map ───────────────────────────────────────────────────────── */
/* the map runs to the bottom edge of the window. a strip of empty page
   under a clipped table is app chrome, not how a web page behaves. */
.mapscroll{overflow:auto;flex:1 1 auto;min-height:0;padding-bottom:0;margin-bottom:-28px}
.mapscroll::-webkit-scrollbar-corner{background:transparent}
.map{align-content:start}
.map{display:grid;align-items:stretch;min-width:min-content;gap:15px;min-height:100%}
.mapscroll::-webkit-scrollbar{width:6px;height:6px}
.mapscroll::-webkit-scrollbar-track{background:transparent}
.mapscroll::-webkit-scrollbar-thumb{background:#D9D9D3;border-radius:3px}
.mapscroll::-webkit-scrollbar-thumb:hover{background:#C7C7C1}

/* row labels — a box, not a filled chip */
.rl{position:sticky;left:0;z-index:3;background:var(--panel);
  box-shadow:14px 0 14px -10px rgba(23,23,26,.07);
  border:1px solid var(--line2);border-radius:10px;display:flex;align-items:center;
  justify-content:center;text-align:center;padding:8px 10px}
.rl span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);line-height:1.45}
.rl.dim span{color:var(--ghost)}

/* ── the three cell states ──────────────────────────────────────────
   ① unopened   white, 1px grey line, a ⊕ and the question
   ② in it      white, 1.5px ink — from the click, not from the typing
   ③ filled     white, 1.5px ink, ink text
   the surface never changes; only the edge does. no dashes anywhere. */
.cell{display:flex;flex-direction:column;justify-content:stretch}
.box{flex:1 1 auto;border:1px solid var(--line);border-radius:10px;background:var(--card);
  padding:13px 14px;display:flex;flex-direction:column;min-height:64px}
.box.empty{background:var(--card);border:1px solid var(--dash)}
.box.shut{background:var(--card);border:1px solid var(--dash2);
  align-items:center;justify-content:center}
.shuthint{font-size:12px;color:var(--ghost);opacity:.6;text-align:center;max-width:220px}
.box.filled{border:1.5px solid var(--ink);background:var(--card)}
/* the edge turns ink the moment you are in the field */
.box:focus-within{border:1.5px solid var(--ink)}
.box.focusnext{border:1.5px solid var(--ink);
  box-shadow:0 1px 2px rgba(23,23,26,.06),0 8px 20px -4px rgba(23,23,26,.10)}

textarea.txt{border:0;background:transparent;resize:none;outline:0;width:100%;flex:1 1 auto;
  font-size:14px;line-height:1.5;padding:0;overflow:hidden;color:var(--ink)}
textarea.txt::placeholder{color:var(--faint)}
textarea.txt[disabled]{cursor:not-allowed}

/* ① unopened: the ⊕ is the affordance */
.box.add{align-items:center;justify-content:center;cursor:pointer}
.box.add .plusdot{width:30px;height:30px;border-radius:50%;border:1px solid var(--dash);
  color:#8A8B90;font-size:17px;line-height:1;display:flex;align-items:center;
  justify-content:center;pointer-events:none}
.box.add:hover{border-color:#B9B9B2}
.box.add:hover .plusdot{border-color:var(--ink);color:var(--ink)}
.box.add.focusnext{border:1px solid var(--ink);box-shadow:none}
.box.add.focusnext .plusdot{border-color:var(--ink);background:var(--ink);color:#fff}
.box.add .askhint{font-size:12.5px;color:var(--ghost);margin-top:11px;text-align:center;
  max-width:252px;line-height:1.45;transition:color .12s}
.box.add:hover .askhint,.box.add.focusnext .askhint{color:var(--mute)}

/* stage head */
.shead{display:flex;align-items:center;gap:0;border:1.5px solid var(--ink);border-radius:10px;
  background:var(--card);overflow:hidden;min-height:50px}
.shead.empty{border:1px solid var(--dash);background:var(--card)}
.shead.next{border:1px solid var(--ink)}
.shead.next .sname::placeholder{color:var(--mute)}
.shead.next .snum{color:var(--mute)}
.shead.open{border:1px solid var(--line)}
.shead:focus-within{border:1.5px solid var(--ink)}
.snum{flex:0 0 auto;padding:0 14px;font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--faint);font-variant-numeric:tabular-nums;
  align-self:stretch;display:flex;align-items:center;border-right:1px solid var(--line2)}
.sname{flex:1 1 auto;border:0;outline:0;background:transparent;padding:13px 14px;font-size:14px;min-width:0}
.sname::placeholder{color:var(--faint)}
.dots{flex:0 0 auto;border:0;background:transparent;color:var(--faint);padding:12px 14px;
  font-size:14px;line-height:1;letter-spacing:1px}
.dots:hover{color:var(--ink)}

/* ── the AI check, shown while the gate is unanswered ───────────────── */
.check{flex:1 1 auto;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);
  padding:22px 22px 20px;display:flex;flex-direction:column;
  box-shadow:0 1px 2px rgba(23,23,26,.06),0 8px 20px -4px rgba(23,23,26,.10)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);margin:0 0 9px}
.check h4{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 12px;line-height:1.3}
.check p{font-size:13.5px;color:var(--mute);margin:0;line-height:1.5}
/* the two options sit under the question, not at the foot of the band.
   pinned to the bottom they landed on the decision owner row the moment
   the band split, and the cursor was already there. */
.check .opts{padding-top:26px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:16px;border:1px solid var(--line);background:var(--card);
  border-radius:10px;padding:14px 16px;text-align:left}
.opt:hover{border-color:var(--ink)}
.opt b{flex:0 0 28px;font-size:14px;font-weight:700}
.opt em{font-style:normal;font-size:12.5px;color:var(--mute);line-height:1.5}
.opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.on em{color:#B7B7B4}

/* the No state — an answer, not an empty cell */
.noai{flex:1 1 auto;border:1px solid var(--line);border-radius:10px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:26px}
.noai.small{padding:18px}
.noai b{font-size:14px;font-weight:500;color:var(--mute)}
.noai span{font-size:12.5px;color:var(--faint);margin-top:7px;max-width:260px;line-height:1.5}

/* the compact human check, inside a normal cell */
.check.tight{padding:14px 16px 14px;border-radius:10px}
.check.tight h5{font-size:14px;font-weight:600;margin:0 0 4px;line-height:1.35}
.check.tight .sub{font-size:12.5px;color:var(--mute);margin:0 0 14px;line-height:1.4}
.yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.yn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 8px;
  font-size:14px;font-weight:700;text-align:center;color:var(--ink)}
.yn:hover{border-color:var(--ink)}

/* ── decision owner ─────────────────────────────────────────────────── */
.cards{flex:1 1 auto;display:grid;gap:11px}
.cards.three{grid-template-columns:repeat(3,1fr)}
.card{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 8px;
  font-size:12.5px;line-height:1.4;text-align:center;color:var(--body);
  display:flex;align-items:center;justify-content:center;position:relative}
.card:hover,.card.hovered{border-color:var(--ink)}
.card.on{background:var(--ink);border-color:var(--ink);color:#fff}
.card[disabled]{background:transparent;border-style:dashed;border-color:var(--dash2);
  color:var(--ghost);cursor:not-allowed}

/* hover explanation — ink, so it never blends with the white cells below */
.tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);
  width:340px;background:var(--ink);color:#fff;border-radius:10px;padding:15px 18px 14px;
  font-size:13px;line-height:1.52;text-align:left;font-weight:400;
  opacity:0;visibility:hidden;transition:opacity .12s;z-index:30;pointer-events:none;
  box-shadow:0 4px 8px rgba(13,13,15,.18),0 16px 36px -8px rgba(13,13,15,.26)}
.tip:after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:var(--ink)}
.tip b{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:#8A8B90;margin-bottom:9px}
.tip em{display:block;font-style:normal;font-size:12.5px;color:#A9AAAF;margin-top:12px;padding-top:11px;
  border-top:1px solid #2E2E32}
.card:hover .tip,.card.hovered .tip,.card:focus-visible .tip{opacity:1;visibility:visible}
/* a card that appears underneath a cursor that never moved was not hovered —
   the pointer was somewhere else and the layout came to it. hold the tip
   back until the pointer actually moves. */
body.nohover .card:hover .tip,body.nohover .card.hovered .tip{opacity:0;visibility:hidden}
/* and take the cards out of the pointer's reach entirely, so the browser has
   no hover state to compute. one real move of the mouse puts them back. */
body.nohover .card{pointer-events:none}

/* add-a-stage column */
.addcol{position:sticky;right:0;z-index:3;background:var(--panel);
  display:flex;align-items:flex-start;justify-content:center;
  box-shadow:-14px 0 14px -10px rgba(23,23,26,.07)}
.plus{width:34px;height:34px;border-radius:50%;border:1px solid var(--dash);background:transparent;
  color:#8A8B90;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.plus:hover{border-color:var(--ink);color:var(--ink)}

/* menu + modal */
.scrim{position:fixed;inset:0;background:rgba(14,15,18,.42);display:flex;align-items:center;
  justify-content:center;z-index:40}
.menu{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line2);border-radius:14px;
  box-shadow:0 2px 6px rgba(23,23,26,.08),0 18px 44px -8px rgba(23,23,26,.16);padding:7px;min-width:262px}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;
  padding:10px 13px;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--panel)}
.menu button.danger{color:#B3261E}
.menu hr{border:0;border-top:1px solid var(--line2);margin:7px 5px}
.modal{background:var(--card);border-radius:14px;padding:28px;max-width:480px;width:calc(100% - 48px);
  border:1px solid var(--line2);
  box-shadow:0 2px 6px rgba(23,23,26,.08),0 18px 44px -8px rgba(23,23,26,.16)}
.modal h3{margin:0 0 10px;font-size:21px;font-weight:600;letter-spacing:-.01em}
.modal p{margin:0 0 10px;font-size:13.5px;color:var(--mute);line-height:1.55}
.modal .row{display:flex;gap:10px;margin-top:20px}
.warn{font-size:12.5px;color:#B3261E}
.hint{font-size:12.5px;color:var(--faint);margin:12px 0 0}

/* ── Experience ─────────────────────────────────────────────────────── */
.two{display:grid;grid-template-columns:400px 1fr;gap:40px;align-items:stretch;
  flex:1 1 auto;min-height:0}
.decl{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.declscroll{flex:1 1 auto;min-height:0;overflow-y:auto;
  background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:20px}
.declscroll::-webkit-scrollbar{width:0}
.work{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.workhead{flex:0 0 auto}
.workhead{border-bottom:1px solid var(--line2);padding-bottom:16px;margin-bottom:0}
.workscroll{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
  padding-top:16px}
.workscroll::-webkit-scrollbar{width:0}
.decl::-webkit-scrollbar,.work::-webkit-scrollbar{width:0}
/* the two columns are content, not objects — no frame of their own */
.rvbody{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
/* the moment header carries a 16px top margin for Experience; in Revise
   it is the first thing under the rule, so it must not add to the 20. */
.rvbody .mhead{margin-top:0}
.decl h3,.work h3{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;line-height:1.3}
.decl>h3,.work>h3{flex:0 0 auto}
.decl .sub,.work .sub{font-size:14px;color:var(--mute);margin:0 0 20px;flex:0 0 auto;
  min-height:21px}
.dsurface{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:24px 28px}
.declscroll .fld{margin:0}
.fld{margin:0}
.fld dt{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.fld dd{margin:7px 0 0;font-size:14.5px;color:var(--ink);line-height:1.5}
.fld dd.q{color:var(--ink)}
.hr{height:1px;background:var(--line2);margin:14px 0}
.fit dt{color:var(--faint)}
.fit dd{font-size:14.5px;font-weight:500}
.fit p{margin:4px 0 0;font-size:12.5px;color:var(--mute);line-height:1.5}

/* journey rail */
.rail{position:relative;padding:8px 0 0}
.raillane{position:relative;height:22px;margin:0 0 6px}
.raillane .ln{position:absolute;top:10px;height:2px;background:var(--line2);border-radius:1px}
.raillane .ln.walked{background:var(--ink);
  transition:left var(--walk) cubic-bezier(.32,0,.24,1),right var(--walk) cubic-bezier(.32,0,.24,1)}
.raillane .mk{transition:left var(--walk) cubic-bezier(.32,0,.24,1)}
.raillane .dot{transition:background-color .28s ease,border-color .28s ease}
.chip{transition:background-color .5s ease,border-color .5s ease,color .5s ease}
.chip .ai{transition:background-color .5s ease,color .5s ease}
.raillane .dot{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;
  background:var(--card);border:1.5px solid var(--line);transform:translateX(-7px)}
.raillane .dot.on{background:var(--ink);border-color:var(--ink)}
.raillane .mk{position:absolute;top:-14px;width:12px;height:12px;border-radius:50%;background:var(--ink);
  transform:translateX(-6px)}
.chips{display:grid;gap:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.chip.now{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .ai{font-size:9.5px;font-weight:700;letter-spacing:.06em;background:var(--ink);color:#fff;
  border-radius:4px;padding:3px 5px}
.chip.now .ai{background:#fff;color:var(--ink)}
.caps2{display:grid;gap:12px;margin-top:9px}
.cap{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.cap i{width:7px;height:7px;background:var(--ink);border-radius:1px;flex:0 0 auto}
.cap.dim{color:var(--faint)}
/* the stage that has just come back. the count is now a result, so it is set
   in ink — the walk arriving somewhere is the one thing worth reading here. */
.cap.now{color:var(--ink);font-weight:500}
/* the stage being searched. it breathes twice, once per sweep of the bar, on
   the same clock — so the caption and the bar are visibly the same event. */
.cap.searching{color:var(--mute)}
.cap.searching span{animation:breathe calc(var(--walk) / 2) ease-in-out infinite}
.cap.searching:before{content:"";width:7px;height:7px;border-radius:50%;flex:0 0 auto;
  background:var(--mute);animation:breathe calc(var(--walk) / 2) ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}
.foot{font-size:11.5px;color:var(--faint);margin:16px 0 0;line-height:1.5}
.workhead .foot{margin:12px 0 0}

/* the moment */
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:16px 0 10px}
.mhead h4{margin:0 0 4px;font-size:16px;font-weight:600}
.mhead .cnt{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.nav{display:flex;gap:6px}
.nav button{border:0;background:transparent;padding:4px 8px;font-size:20px;line-height:1;color:var(--faint)}
.nav button:not([disabled]){color:var(--ink)}
.nav button[disabled]{cursor:default}
.carousel{position:relative;overflow:hidden}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px 20px;
  box-shadow:0 1px 2px rgba(23,23,26,.06),0 10px 24px -4px rgba(23,23,26,.10);width:calc(100% - 50px)}
.peek{position:absolute;right:0;top:10px;bottom:10px;width:38px;background:var(--card);
  border:1px solid #E6E6E1;border-right:0;border-radius:12px 0 0 12px;
  box-shadow:0 4px 10px -2px rgba(23,23,26,.05)}
.quote{font-size:19px;font-weight:500;letter-spacing:-.01em;line-height:1.4;margin:0}
.srcline{margin:11px 0 0;font-size:12px;color:var(--faint)}
.srcline a{color:var(--mute);text-decoration:none;border-bottom:1px solid var(--line)}
.srcline a:hover{color:var(--ink);border-color:var(--ink)}
.mrule{height:1px;background:#E0E0E0;margin:16px 0}
.split{display:grid;grid-template-columns:1fr 1px 1fr;gap:22px}
.split .vr{background:var(--line2)}
.lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0}
.tier{font-size:12.5px;color:var(--mute);margin:3px 0 10px}
.gateline{font-size:12px;color:var(--ink);margin:0 0 14px;line-height:1.5}
.dim{display:grid;grid-template-columns:94px auto 1fr;align-items:center;gap:10px;margin:0 0 7px;font-size:12.5px;color:var(--body)}
.marks{display:flex;gap:3px}
.marks i{width:11px;height:3px;border-radius:2px;background:#E4E4DF}
.marks i.on{background:var(--ink)}
.dimv{font-size:12.5px;color:var(--body)}
.infer{font-size:13.5px;color:var(--body);line-height:1.55;margin:0}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:16px}
.mfoot p{margin:0;font-size:12.5px;color:var(--mute);max-width:420px;line-height:1.5}
.dots2{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}
.dots2 i{width:5px;height:5px;border-radius:50%;background:#DCDCD7}
.dots2 i.on{background:var(--ink)}

/* the centred states — never a card, they are not objects you act on */
.state{text-align:center;padding:58px 40px}
.state h4{margin:0 0 10px;font-size:21px;font-weight:600;letter-spacing:-.01em}
.state p{margin:0 auto 6px;font-size:13.5px;color:var(--mute);max-width:520px;line-height:1.6}
.state p.q{color:var(--faint);font-size:12.5px;margin-top:12px}
.state .btn{margin-top:22px}
.searchbar{position:relative;width:420px;max-width:70%;height:4px;background:var(--line2);
  border-radius:2px;margin:0 auto 28px;overflow:hidden}
.searchbar i{position:absolute;left:0;top:0;width:34%;height:4px;background:var(--ink);
  border-radius:2px;animation:sweep .9s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(194%)}}

/* transcript */
.tpanel{background:var(--card);border:1px solid #E5E5E1;border-radius:16px;padding:30px 32px 26px;
  width:820px;max-width:calc(100% - 64px);position:relative;
  box-shadow:0 24px 64px -12px rgba(15,15,13,.20)}
.tpanel .x{position:absolute;top:30px;right:32px;border:0;background:transparent;color:var(--faint);
  font-size:19px;line-height:1}
.tmeta{display:grid;grid-template-columns:186px 128px 214px 1fr;gap:0;margin:20px 0 14px}
.tmeta dt{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tmeta dd{margin:7px 24px 0 0;font-size:13.5px;color:var(--body);line-height:1.5}
.tnote{font-size:12px;color:var(--faint);line-height:1.5;margin:0 0 24px}
.tscroll{border:1px solid var(--line2);border-radius:12px;background:#FCFCFB;
  padding:20px 24px;max-height:372px;overflow-y:auto}
.tscroll::-webkit-scrollbar{width:4px}
.tscroll::-webkit-scrollbar-track{background:#EDEDE9;border-radius:2px}
.tscroll::-webkit-scrollbar-thumb{background:#C9C9C4;border-radius:2px}
.turn{display:grid;grid-template-columns:86px 1fr;gap:14px;margin:0 0 15px}
.turn .who{font-size:9.5px;font-weight:600;letter-spacing:.06em;color:#C9C9C4;padding-top:3px}
.turn.p .who{color:var(--ink)}
.turn .said{font-size:14px;color:var(--faint);line-height:1.66;margin:0}
.turn.p .said{color:var(--body)}
.turn.hit .said{color:var(--ink);font-size:15px;font-weight:500;line-height:1.58;
  border-left:3px solid var(--ink);padding-left:13px;margin-left:-16px}
.tellipsis{font-size:11.5px;color:var(--ghost);margin:0 0 16px}
.tfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:20px}
.tfoot span{font-size:13px;color:var(--faint)}

/* ── Revise ─────────────────────────────────────────────────────────── */
.rvtwo{display:grid;grid-template-columns:400px 1fr;gap:0 40px;
  grid-template-rows:auto minmax(0,1fr);align-items:stretch;flex:1 1 auto;min-height:0}
.rvhead{align-self:end;padding-bottom:16px}
.rvhead.ruled{}
.rvhead h3{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;line-height:1.3}
.rvhead .sub{font-size:14px;color:var(--mute);margin:0;min-height:21px}
/* the rule is the top edge of both columns: the left card starts on it,
   the right content starts on it, and scrolled content is cut by it. */
.rvtwo .decl{padding-top:0}
.rvtwo .workscroll{padding-top:0}
.stagelist{position:relative;display:flex;flex-direction:column;gap:12px;
  overflow-y:auto;min-height:0;background:var(--card);border:1px solid var(--line2);
  border-radius:12px;padding:20px 20px 20px 40px}
.stagelist:before{content:"";position:absolute;left:15px;top:26px;bottom:26px;width:2px;
  background:var(--line2);border-radius:1px}
.stagelist::-webkit-scrollbar{width:0}
/* the row is a <button>, and a button inside a plain block shrinks to fit its
   text instead of filling the column. that is where the gap on the right came
   from — nothing was padding it, the row just never grew. */
.srow{position:relative;width:100%;box-sizing:border-box;
  border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;flex:0 0 auto}
.srow:hover{border-color:#C9C9C4}
.srow.on{border:1.5px solid var(--ink)}
.stagerow{position:relative;flex:0 0 auto}
.stagerow>.dot{position:absolute;left:-30px;top:15px;width:12px;height:12px;border-radius:50%;
  background:var(--ink);box-sizing:border-box}
.stagerow.ahead>.dot{background:var(--card);border:1px solid var(--line)}
.srhd{padding:0;display:flex;flex-direction:column;border-radius:11px}
.srow.on .srhd{background:var(--ink);border-radius:10.5px 10.5px 0 0}
.srow .nm{min-height:48px;padding:0 16px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;font-size:14px;font-weight:500}
.srow .st{min-height:28px;padding:0 16px 9px;font-size:12px;line-height:19px;color:var(--mute)}
.srow.on .nm{color:#fff}
.srow.on .st{color:#A9AAAF}
.srow.none{background:transparent;border-style:dashed;border-color:var(--dash2)}
.srow.none .nm,.srow.none .st{color:var(--ghost)}
.srow .ai{font-size:9.5px;font-weight:700;letter-spacing:.06em;background:var(--ink);color:#fff;
  border-radius:4px;padding:3px 5px}
.srow.on .ai{background:#fff;color:var(--ink)}
.srow .decl2{background:var(--card);padding:14px 16px 16px;display:grid;gap:0}
.srow .decl2 .lab2{font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin:0 0 4px}
.srow .decl2 .val{font-size:12px;line-height:1.45;color:var(--ink);margin:0 0 12px;
  padding-bottom:12px;border-bottom:1px solid var(--line2)}
.srow .decl2 .val:last-child{margin:0;padding-bottom:0;border-bottom:0}
.srow .decl2 .hdlab{font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin:0 0 12px}

.keptcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px 20px;
  box-shadow:0 1px 2px rgba(23,23,26,.06),0 10px 24px -4px rgba(23,23,26,.10)}
.keptcard .accepted{margin:16px 0 0;padding-top:14px;border-top:1px solid #E0E0E0}
.lenses{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px;
  flex:1 1 auto;min-height:0}
.lens{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 20px 20px;
  display:flex;flex-direction:column;text-align:left;justify-content:space-between;
  min-height:0;overflow-y:auto;
  box-shadow:0 1px 2px rgba(23,23,26,.06),0 10px 24px -4px rgba(23,23,26,.10)}
.lens::-webkit-scrollbar{width:0}
.lens h5{margin:0 0 9px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.lens .qq{margin:0;font-size:13.5px;color:var(--body);line-height:1.5}
.lens .def{margin:14px 0 0;font-size:12px;color:var(--mute);line-height:1.5}
.lens .def b{display:block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);margin-bottom:5px}
.lens .flip{margin-top:auto;padding-top:20px;font-size:12.5px;color:var(--mute);display:flex;gap:8px;align-items:center}
.lens.open{border:1.5px solid var(--ink)}
.lens .fieldbox{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:11px 12px;
  font-size:12.5px;line-height:1.5}
.lens .fieldbox .was{color:var(--faint);text-decoration:line-through}
.lens .fieldbox .now{color:var(--ink);font-weight:500;margin-top:5px}
.lens .fieldbox .ask{margin:12px 0 8px;font-size:12px;color:var(--mute)}
.rvtext{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  font-size:12.5px;line-height:1.5;resize:none;outline:0;background:var(--card);color:var(--ink)}
.rvtext:focus{border:1.5px solid var(--ink);padding:8.5px 9.5px}
.rvtext::placeholder{color:var(--faint)}
.rvopts{display:grid;gap:6px}
.rvopts.two{grid-template-columns:1fr 1fr}
.rvopt{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;
  font-size:12px;line-height:1.35;text-align:left;color:var(--body);position:relative}
.rvopt:hover{border-color:var(--ink)}
.rvopt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rvopt.cur{opacity:.55}
.rvopt .curtag{float:right;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.rvfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex:0 0 auto}

/* ── the report ─────────────────────────────────────────────────────── */
.sheet{background:var(--card);border:1px solid #E5E5E1;border-radius:12px;padding:36px 40px 40px;
  overflow-y:auto;min-height:0;flex:1 1 auto}
.sheet::-webkit-scrollbar{width:4px}
.sheet::-webkit-scrollbar-thumb{background:#DCDCD7;border-radius:2px}
.sheet h2{margin:9px 0 0;font-size:26px;font-weight:600;letter-spacing:-.015em}
.sheet .meta{margin:8px 0 0;font-size:12px;color:var(--faint)}
.sheet section{margin-top:32px}
.sheet h3{margin:0 0 14px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint)}
.rtable{display:grid;gap:0;font-size:12px}
.rtable .rh{padding:10px 14px 10px 0;border-bottom:1px solid var(--line2);display:flex;
  flex-direction:column;gap:3px}
.rtable .rh .num{font-size:12px;font-weight:500;color:var(--mute)}
.rtable .rh .nm{font-size:12px;font-weight:600}
.rtable .rh .chgtag{margin-top:4px;align-self:flex-start;font-size:10px;font-weight:600;
  letter-spacing:.06em;background:var(--ink);color:#fff;border-radius:4px;padding:2px 6px}
/* a band label spans the whole width — Build, Experience, Revise */
.rtable .rband{grid-column:1/-1;padding:26px 0 8px;font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.rtable .rc{padding:10px 14px 10px 0;border-bottom:1px solid #F0F0EC;line-height:1.5;
  white-space:pre-line}
/* shaded = a change was requested on this field */
.rtable .rc.changed{background:#F1F1ED;padding-left:10px;margin-right:8px;border-radius:4px}
.rtable .rc.changed .rv{font-weight:500;color:var(--ink)}
.rtable .rc .rv{margin:0}
.rtable .rc .chgmark{margin:7px 0 0;font-size:10px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink)}
.rnote{margin:18px 0 0;font-size:12px;color:var(--mute);line-height:1.55}
.rtop{display:flex;gap:10px;align-items:center;flex:0 0 auto}
.rtable .rl2{padding:10px 0;border-bottom:1px solid #F0F0EC;font-size:10px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.rtable .dash{color:var(--faint)}
.chg{border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.chg .hd{font-size:13px;font-weight:600;margin:0 0 14px}
.chg .ba{display:grid;grid-template-columns:1fr 28px 1fr;gap:0;align-items:start}
.chg .ba .k{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  margin:0 0 6px}
.chg .ba .v{font-size:12.5px;line-height:1.5;margin:0}
.chg .ba .v.was{color:var(--faint)}
.chg .arrow{text-align:center;color:var(--faint);padding-top:18px}
.chg blockquote{margin:16px 0 0;padding:0;font-size:14px;line-height:1.5;color:var(--ink)}
.chg .cite{margin:6px 0 0;font-size:11.5px;color:var(--faint)}
.gap{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:16px 18px}
.gap p{margin:0 0 7px;font-size:12.5px;color:var(--body);line-height:1.55}
.gap p:last-child{margin:0}

/* ── the fork: re-walk, or export as it stands ──────────────────────── */
.fork{max-width:760px;margin:0 auto;text-align:center;padding:52px 0 0}
.fork h3{margin:0 0 10px;font-size:21px;font-weight:600;letter-spacing:-.01em}
.fork .lede{margin:0 auto 30px;font-size:14px;color:var(--mute);line-height:1.6;max-width:600px}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;
  overflow:hidden}
.ledger .r{display:grid;grid-template-columns:80px 1fr auto;gap:16px;align-items:center;
  padding:13px 20px;border-bottom:1px solid #F0F0EC;font-size:13.5px}
.ledger .r:last-child{border-bottom:0}
.ledger .r b{font-weight:500}
.ledger .r .tag{font-size:12px;color:var(--mute);font-weight:500;white-space:nowrap}
.ledger .r.quiet,.ledger .r.quiet .tag{color:var(--faint)}
.ledger .r.quiet b{color:var(--faint)}
.forkq{margin-top:44px}
.forkq .cap{justify-content:center;font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.forkq h3{font-size:21px}
.forkbtns{display:flex;gap:12px;justify-content:center;margin-top:26px}
.gap b{font-weight:600}
/* ══ entry: start page · account · set up ═══════════════════════════════
   these three sit before the three-step bar, so they carry their own
   chrome. the marketing page is the only surface that scrolls as a page. */
.site{flex:1 1 auto;min-height:0;overflow-y:auto;background:var(--panel)}

/* `.nav` was already taken by the moment carousel — this bar is `.topnav`,
   and its content lines up with the 80px page margin. */
.topnav{position:sticky;top:0;z-index:5;height:68px;background:#fff;
  border-bottom:1px solid var(--line2);display:flex;align-items:center;
  justify-content:space-between;padding:0 80px;flex:0 0 auto}
.wordmark{font-size:20px;font-weight:600;letter-spacing:-.012em;background:none;border:0;padding:0;
  color:var(--ink)}
.navr{display:flex;align-items:center;gap:26px}
.navlink{background:none;border:0;padding:0;font-size:14px;font-weight:400;color:var(--body)}
.navlink.med{font-weight:500;color:var(--ink)}
.navdiv{width:1px;height:18px;background:var(--div)}
.navcta{border:0;background:var(--ink);color:#FFFFFF;border-radius:10px;height:40px;width:92px;
  font-size:13.5px;font-weight:600}
.navcta:hover{background:#000}

.hero{background:var(--panel);padding:140px 80px 170px}
.hero h1{font-size:64px;line-height:1.11;letter-spacing:-.028em;font-weight:600;margin:0;max-width:1280px}
.hero .lede{font-size:19px;line-height:1.62;color:var(--body);margin:36px 0 0;max-width:720px}
.gostart{border:0;background:var(--ink);color:#fff;border-radius:10px;height:64px;padding:0 38px;
  font-size:17px;font-weight:600;margin-top:44px}
.gostart:hover{background:#000}
/* no rule between sections. a web page separates sections with space and
   with the label at the top of each one, not with a line drawn across it.
   the spacing is all bottom padding, so the rhythm stays the same whether
   a section is short or long. */
.band{background:var(--panel);padding:0 80px 170px}
.band:last-child{padding-bottom:190px}
.ebrow{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 17px 0 15px;
  border:1px solid #A4A4A4;border-radius:10px;font-size:16px;color:var(--ink);margin:0}
.ebrow b{width:7px;height:7px;border-radius:2px;background:var(--ink);flex:0 0 auto}
.band h2{font-size:52px;line-height:1.1;letter-spacing:-.022em;font-weight:600;margin:32px 0 0;max-width:1180px}
.band h2.sm{font-size:56px}
.band .lede{font-size:19px;line-height:1.6;color:var(--body);margin:28px 0 0;max-width:820px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:80px;margin-top:80px}
.cols3 h3{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0 0 12px}
.cols3 h3.big{font-size:21px}
.cols3 p{font-size:16px;line-height:1.6;color:var(--body);margin:0}

/* the three step cards — ink-edged, 32px padding, a 372px stage for the
   schematic. shapes only: it says what the step is built like and
   claims nothing it cannot show. */
.hcards{display:grid;grid-template-columns:repeat(3,1fr);gap:0 88px;margin:80px 0 0}
.hcard{position:relative;padding:0}
.hcard+.hcard::before{content:"";position:absolute;left:-44px;top:0;bottom:0;
  width:1px;background:var(--line2)}
.hchd{display:flex;align-items:center;gap:13px;height:23px}
.hchd s{display:block;width:24px;height:1px;background:var(--ghost);text-decoration:none;flex:0 0 auto}
.hchd i{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.07em;color:var(--faint)}
.hchd b{font-size:15px;font-weight:600;letter-spacing:.02em}
.hcard h3{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.35;
  margin:40px 0 12px;min-height:2.7em}
.hcard p{font-size:16px;line-height:1.6;color:var(--body);margin:0}
.ill{position:relative;width:100%;height:372px;margin-top:30px}
.illin{position:absolute;left:0;top:0;width:373px;height:372px;transform-origin:top left}
.illin i{position:absolute;display:block;box-sizing:border-box}
/* the schematics play once, when they first come into view. every part
   carries its own --d so the order tells the story: what you fill in
   first appears first, and what is still empty arrives last. */
@keyframes illrise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes illfade{from{opacity:0}to{opacity:1}}
@keyframes illgx{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes illgy{from{opacity:1;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
.ill{--illt:.82s;--illg:1.05s}
.ill.anim .illin>i{opacity:0}
.ill.anim.play .illin>i{animation:illrise var(--illt) cubic-bezier(.22,.72,.28,1) both;animation-delay:var(--d,0ms)}
.ill.anim.play .illin>i.fo{animation:illfade var(--illt) ease both;animation-delay:var(--d,0ms)}
.ill.anim.play .illin>i.gx{animation:illgx var(--illg) cubic-bezier(.32,.76,.3,1) both;animation-delay:var(--d,0ms);transform-origin:left center}
.ill.anim.play .illin>i.gy{animation:illgy var(--illg) cubic-bezier(.32,.76,.3,1) both;animation-delay:var(--d,0ms);transform-origin:bottom center}
@media (prefers-reduced-motion:reduce){
  .ill.anim .illin>i{opacity:1}
  .ill.anim.play .illin>i,.ill.anim.play .illin>i.fo,
  .ill.anim.play .illin>i.gx,.ill.anim.play .illin>i.gy{animation:none}
}

/* ══ account ══════════════════════════════════════════════════════════
   564 / 876 — a white form beside the base it is about. */
.auth{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:564fr 876fr}
.authL{background:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 68px 0 69px}
.authLin{width:427px;max-width:100%}
.authL h2{font-size:30px;font-weight:600;letter-spacing:-.018em;margin:0}
.authL .lede{font-size:14.5px;color:var(--mute);margin:10px 0 0}
.aulab{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin:36px 0 9px}
.aufld{height:51px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 16px}
/* same language as Build: an ink edge means you are in it, or it holds
   something */
.aufld:focus-within,.aufld:has(input:not(:placeholder-shown)){
  border:1.5px solid var(--ink);padding:0 15.5px}
.aufld input{width:100%;height:49px;border:0;outline:0;background:transparent;font-size:14px;display:block}
.aufld ::placeholder{color:var(--faint)}
.aubtn{width:100%;height:52px;margin-top:32px;border:0;border-radius:10px;background:var(--ink);
  color:#fff;font-size:13.5px;font-weight:600}
.aubtn[disabled]{background:#E4E4DF;color:var(--faint);cursor:not-allowed}
.aurule{height:1px;background:var(--line2);margin:48px 0 23px}
.swap{font-size:13.5px;color:var(--mute);margin:0}
.swap button{background:none;border:0;padding:0;font-size:13.5px;font-weight:600;color:var(--ink)}

.authR{background:var(--panel);display:flex;flex-direction:column;justify-content:center;padding:0 80px}
.authRin{width:716px;max-width:100%}
.aueyebrow{display:inline-flex;align-items:center;gap:10px;height:35px;padding:0 17px 0 15px;
  background:var(--panel);border:1px solid var(--line2);border-radius:10px;
  font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink)}

const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return el;
};

const SCROLLERS = ".decl,.work,.workscroll,.mapscroll,.tscroll,.stagelist,.sheet,.site,.supanel";
/* one pass, one swap. emptying the root and then appending lets the
   browser paint the blank frame in between — that was the flicker. and
   tearing down a focused textarea fires its blur, which re-entered
   render() and wiped the cell that had just been opened: the two clicks. */
let rendering = false;
function render() {
  if (rendering) return;
  rendering = true;
  const root = document.getElementById("root");
  const keep = {};
  if (!S.resetScroll)
    document.querySelectorAll(SCROLLERS).forEach(el => {
      keep[el.className] = [el.scrollTop, el.scrollLeft];
    });

  /* was the pointer already on a decision card before this render? if it was,
     it is a real hover and must survive the swap. if it was not, whatever
     lands under it afterwards arrived on its own. */
  const was  = ptr.x < 0 ? null : document.elementFromPoint(ptr.x, ptr.y);
  const held = !!(was && was.closest && was.closest(".card"));

  const frag = document.createDocumentFragment();
  if (S.step === "start" || S.step === "auth" || S.step === "setup") {
    frag.appendChild(S.step === "start" ? Start() : S.step === "auth" ? Auth() : Setup());
  } else {
    frag.appendChild(TopBar());
    frag.appendChild(
        S.step === "review"     ? Review()
      : S.step === "experience" ? Experience()
      : S.step === "revise"     ? Revise()
      : S.step === "fork"       ? Fork()
      : S.step === "report"     ? Report()
      :                           Build());
    if (S.exp && S.exp.transcript) frag.appendChild(Transcript());
    if (S.menu)  frag.appendChild(Menu());
    if (S.modal) frag.appendChild(Modal());
  }
  root.replaceChildren(frag);

  document.querySelectorAll("textarea.txt").forEach(grow);
  fitIll();
  armIll();
  document.querySelectorAll(SCROLLERS).forEach(el => {
    const v = keep[el.className];
    if (v) { el.scrollTop = v[0]; el.scrollLeft = v[1]; }
  });
  document.body.classList.toggle("nohover", !held);
  reHover(held);
  S.resetScroll = false;
  rendering = false;
}
const grow = t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };

const ptr = { x: -1, y: -1 };
function reHover(apply) {
  const el = apply && ptr.x >= 0 ? document.elementFromPoint(ptr.x, ptr.y) : null;
  const card = el && el.closest ? el.closest(".card") : null;
  document.querySelectorAll(".card.hovered").forEach(c => {
    if (c !== card) c.classList.remove("hovered");
  });
  if (card) card.classList.add("hovered");
}
/* the browser fires a mousemove of its own after the layout changes under a
   still cursor — same coordinates, no hand behind it. only a move that
   actually moves counts. */
window.addEventListener("pointermove", e => {
  if (e.clientX === ptr.x && e.clientY === ptr.y) return;
  ptr.x = e.clientX; ptr.y = e.clientY;
  document.body.classList.remove("nohover");
  reHover(true);
});
/* the schematics are drawn at their Figma size and scaled to the card */
function fitIll() {
  document.querySelectorAll(".ill").forEach(el => {
    const s = Math.min(1, el.clientWidth / 373);
    el.style.height = Math.round(372 * s) + "px";
    if (el.firstChild) el.firstChild.style.transform = "scale(" + s + ")";
  });
}
window.addEventListener("resize", fitIll);

/* the schematics replay on hover, and — while they are on screen — on a
   slow timer. the pause is long on purpose: three diagrams cycling in
   step would pull the eye off the words they are there to explain. */
let illObs = null, illTimers = [];
function armIll() {
  illTimers.forEach(clearInterval); illTimers = [];
  const els = document.querySelectorAll(".ill.anim");
  if (!els.length) return;
  if (!("IntersectionObserver" in window) ||
      window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    els.forEach(e => e.classList.add("play")); return;
  }
  const span = el => {                  /* longest delay, plus its own run */
    let m = 0;
    el.querySelectorAll(".illin > i").forEach(i => {
      const d = parseFloat(i.style.getPropertyValue("--d")) || 0;
      if (d > m) m = d;
    });
    return m + 1100;
  };
  const play = el => {
    el.classList.remove("play");
    void el.offsetWidth;                          /* restart the keyframes */
    el.classList.add("play");
    el.dataset.at = Date.now();
  };
  if (!illObs) illObs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const el = en.target;
      if (!en.isIntersecting) return;
      if (!el.classList.contains("play")) play(el);
      if (ILL_LOOP && !el.dataset.loop) {
        el.dataset.loop = "1";
        illTimers.push(setInterval(() => play(el), span(el) + ILL_GAP));
      }
    });
  }, { threshold: 0.2 });
  els.forEach(el => {
    illObs.observe(el);
    el.addEventListener("pointerenter", () => {
      if (Date.now() - (+el.dataset.at || 0) > span(el)) play(el);
    });
  });
}

/* ── the schematics' tempo ────────────────────────────────────────────
   ILL_SPEED  stretches every delay below. 1 = the pace it was built at.
   ILL_LOOP   replay on a timer while the schematic is on screen.
   ILL_GAP    the pause between one run and the next.

const ILL_SPEED = 2.4, ILL_LOOP = true, ILL_GAP = 4200;

const px = (x, y, w, hh, css, d, cls) => h("i", { class: cls || null, style:

const cell = (x, y, w, hh, on, d) => px(x, y, w, hh,
  "border-radius:6px;border:1.5px solid " + (on ? "var(--ink);background:#fff" : "#D5D5CF"), d);
const bar = (x, y, w, c, d) => px(x, y, w, 3, "border-radius:2px;background:" + c, d);
const ink = "var(--ink)", pale = "#E4E4DF", grey = "#D5D5CF";

/* typing must not rebuild the tree — that would drop the caret. only the
   continue button and the filled border react while a field has focus. */
function refreshSetup() {
  const b = document.getElementById("sucont");
  if (b) b.disabled = !setupReady();
  document.querySelectorAll(".sufld").forEach(box => {
    const f = box.querySelector("input,textarea");
    if (f) box.classList.toggle("on", !!f.value.trim());
  });
}
function setupReady() {
  const p = S.project;
  return S.setup === 1 ? !!p.name.trim()
       : S.setup === 2 ? p.own !== null
       : S.setup === 3 ? !!(p.audience.trim() && p.context.trim())
       :                 !!p.fit;
}
function suInput(val, ph, set, rows) {
  const el = rows ? h("textarea", { rows: rows, placeholder: ph })
                  : h("input", { type: "text", placeholder: ph });
  el.value = val;
  el.addEventListener("input", e => { set(e.target.value); refreshSetup(); });
  return h("div", { class: "sufld" + (val.trim() ? " on" : "") }, el);
}

      h("button", { class: "lnk", text: "Save and exit", onclick: () => goto("start") })),
    h("div", { class: "supanel" },
      h("div", { class: "suin" },
        h("div", { class: "surail" },
          h("div", { class: "labs" },
            SURAIL.map((lab, i) => h("div", { class: i + 1 === n ? "on" : "", text: lab }))),
          h("div", { class: "rule" },
            SURAIL.map((_, i) => h("i", { class: i + 1 === n ? "on" : "" })))),
        h("div", { class: "suhd" },
          h("h2", { text: head[0] }), h("p", { class: "lede", text: head[1] })),
        h("div", { class: "sucard" }, card),
        h("div", { class: "suact" },
          cont,
          n === 4 ? h("button", { class: "btn ghost", text: "Add my own evidence",
            onclick: () => goto("setup", { setup: 2 }) }) : null))));
}

/* ─────────────────────────────────────────────────────────── top bar */
const STEPS = [
  ["Step 1: Build",      "AI-mediated service journey mapping"],
  ["Step 2: Experience", "Evidence-informed AI walkthrough"],
  ["Step 3: Revise",     "Evidence-backed change requests"],
];
/* the toolkit is a loop, so the bar has to let you back. a step you have
   already been through stays open; one you have not reached does not. */
function TopBar() {
  const at = S.step === "experience" ? 1
           : (S.step === "revise" || S.step === "fork" || S.step === "report") ? 2 : 0;
  const reached = S.reached || 0;
  const goBack = i => {
    S.resetScroll = true;
    if (i === 0) { S.step = "build"; render(); }
    else if (i === 1) {
      S.step = "experience";
      /* stages can have been edited while you were away */
      if (!S.exp || !S.stages[S.exp.i]) enterStage(0); else render();
    } else { S.step = "revise"; render(); }
  };
  return h("div", { class: "topbar" },
    h("div", { class: "steps" },
      STEPS.map(([a, b], i) => {
        const open = i <= reached && i !== at;
        return h("button", {
            class: "stepcol" + (i === at ? " on" : "") + (open ? " can" : ""),
            disabled: !open,
            title: open ? "Back to " + a.replace(/^Step \d: /, "") : null,
            onclick: () => goBack(i) },
          h("h4", { text: a }), h("p", { text: b }));
      })),
    h("div", { class: "steprule" },
      STEPS.map((_, i) => h("i", { class: i === at ? "on" : "" }))));
}

/* ─────────────────────────────────────────────────────────── build */
function Build() {
  const done = S.stages.filter(isDone).length;
  return h("div", { class: "wrap" },
    h("div", { class: "frame panel" },
      h("div", { class: "phdrrow" },
        h("div", {},
          h("h2", { class: "phdr", text: "AI involvement map" }),
          h("p",  { class: "phdrsub", text: "Name your stages across the top first, then fill each one down. Enter moves to the next." })),
        h("button", { class: "btn", disabled: done === 0,
          onclick: () => { S.step = "review"; S.resetScroll = true; render(); } }, "Check your answers")),
      Map()));
}

/* the band splits into four sub-rows as soon as any stage answers Yes.
   every cell is placed explicitly — nothing relies on auto-flow. */
function Map() {
  const split    = S.stages.some(s => s.ai === true);
  const n        = S.stages.length;
  const bandRows = split ? 4 : 1;
  const R_STAGE = 1, R_USER = 2, R_BAND = 3;
  const R_GOAL  = R_BAND + bandRows;
  const C_ADD   = n + 2;

  const fr = f => `minmax(min-content,${f}fr)`;
  const grid = h("div", { class: "map", style:
    `grid-template-columns:126px repeat(${n},396px) 84px;` +
    `grid-template-rows:auto ${fr(1)} ` +
    (split ? `${fr(1)} ${fr(1)} ${fr(.8)} ${fr(1.2)}` : fr(4)) + ` ${fr(1)}` });

  const put = (el, row, col, rowSpan = 1) => {
    el.setAttribute("style",
      `grid-row:${row}/span ${rowSpan};grid-column:${col}` +
      (el.getAttribute("style") ? ";" + el.getAttribute("style") : ""));
    grid.appendChild(el);
    return el;
  };
  const rail = (txt, row, rowSpan = 1) =>
    put(h("div", { class: "rl" }, h("span", { text: txt })), row, 1, rowSpan);

  /* stage */
  rail("Stage", R_STAGE);
  S.stages.forEach((s, i) => put(StageHead(s, i), R_STAGE, i + 2));
  put(h("div", { class: "addcol" },
    h("button", { class: "plus", title: "Add a stage",
      onmousedown: e => { e.preventDefault(); S.stages.push(blankStage()); render();
        /* bring the new stage into view and put the caret in its name */
        const m = document.querySelector(".mapscroll");
        const names = document.querySelectorAll("input.sname");
        const last = names[names.length - 1];
        if (last) last.focus({ preventScroll: true });
        if (m && m.scrollTo) m.scrollTo({ left: m.scrollWidth, behavior: "smooth" });
        else if (m) m.scrollLeft = m.scrollWidth;
      } }, "+")),
    R_STAGE, C_ADD, R_GOAL);

  /* user action */
  rail("User action", R_USER);
  S.stages.forEach((s, i) => put(TextCell(s, "userAction"), R_USER, i + 2));

  /* the AI involvement band */
  if (!split) {
    rail("AI involvement", R_BAND);
    S.stages.forEach((s, i) => put(BandCell(s), R_BAND, i + 2));
  } else {
    ["AI\naction", "AI\noutput", "Decision\nowner", "Human\nintervention"]
      .forEach((lab, ri) => rail(lab, R_BAND + ri));
    S.stages.forEach((s, i) => {
      if (s.ai === true) for (let ri = 0; ri < 4; ri++) put(SubCell(s, ri), R_BAND + ri, i + 2);
      else put(BandCell(s), R_BAND, i + 2, 4);
    });
  }

  /* goal */
  rail("User experience\ngoal", R_GOAL);
  S.stages.forEach((s, i) => put(TextCell(s, "goal"), R_GOAL, i + 2));

  return h("div", { class: "mapscroll" }, grid);
}

function StageHead(s, i) {
  const empty = !started(s);
  const open  = S.editing && S.editing.key === s.key && S.editing.field === "name";
  const input = h("input", { class: "sname", placeholder: "Name the stage",
    oninput: e => { s.name = e.target.value; if (s.walked) s.dirty = true; },
    onkeydown: e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } },
    onblur: () => render() });
  input.value = s.name;
  return h("div", { class: "cell" },
    h("div", { class: "shead" + (empty ? (open ? " open" : " empty") : "")
                  + (nextField(s) === "name" ? " next" : "") },
      h("span", { class: "snum", text: String(i + 1).padStart(2, "0") }),
      input,
      empty ? null : h("button", { class: "dots", title: "Stage options",
        onmousedown: e => { e.preventDefault();
          const b = e.target.getBoundingClientRect();
          S.menu = { key: s.key, x: b.right - 262, y: b.bottom + 6 };
          render();
        } }, "•••")));
}

function TextCell(s, field) {
  const ph     = ASK[field];
  const filled = s[field].trim() !== "";
  const isNext = nextField(s) === field;
  const open   = S.editing && S.editing.key === s.key && S.editing.field === field;

  /* ① unopened. the ⊕ is the affordance; the question rides with it.
     opens on mousedown, before any other field's blur can rebuild the DOM
     underneath the click. that race is what made it take two clicks. */
  if (!filled && !open) return h("div", { class: "cell" },
    h("div", { class: "box empty add" + (isNext ? " focusnext" : ""),
      onmousedown: e => { e.preventDefault(); S.editing = { key: s.key, field }; render(); focusCell(); } },
      h("div", { class: "plusdot", text: "+" }),
      h("div", { class: "askhint", text: ph.split("\n")[0] })));

  /* ② opened, empty → the question and the example sit in the placeholder
     ③ filled        → ink border, ink text */
  const t = h("textarea", { class: "txt", placeholder: ph, rows: 1, "data-open": open ? "1" : null,
    oninput: e => { s[field] = e.target.value; if (s.walked) s.dirty = true; grow(e.target); },
    onblur: () => { if (S.editing && S.editing.key === s.key && S.editing.field === field) {
      S.editing = null; render(); } } });
  t.value = s[field];
  return h("div", { class: "cell" },
    h("div", { class: "box" + (filled ? " filled" : "") + (isNext && !filled ? " focusnext" : "") }, t));
}
function focusCell() {
  setTimeout(() => {
    const el = document.querySelector('textarea[data-open="1"]');
    if (!el) return;
    /* focus() drags the nearest scroll container to reveal the element,
       which undoes the position render() just restored. take it, then
       put it back. */
    const keep = {};
    document.querySelectorAll(SCROLLERS).forEach(x => {
      keep[x.className] = [x.scrollTop, x.scrollLeft];
    });
    el.focus({ preventScroll: true });
    grow(el);
    document.querySelectorAll(SCROLLERS).forEach(x => {
      const v = keep[x.className];
      if (v) { x.scrollTop = v[0]; x.scrollLeft = v[1]; }
    });
  }, 0);
}

/* one cell covering the whole band: the AI check, or the No state, or nothing yet */
function BandCell(s) {
  const wrap = kids => h("div", { class: "cell" }, kids);
  const open = S.editing && S.editing.key === s.key && S.editing.field === "gate";
  const isNext = nextField(s) === "gate";

  /* ① unopened — the same ⊕ and question as every other block */
  if (s.ai === null && !open) return wrap(
    h("div", { class: "box empty add" + (isNext ? " focusnext" : ""),
      onmousedown: e => { e.preventDefault(); S.editing = { key: s.key, field: "gate" }; render(); } },
      h("div", { class: "plusdot", text: "+" }),
      h("div", { class: "askhint", text: "Is AI involved at this stage?" })));

  if (s.ai === false) return wrap(h("div", { class: "noai" },
    h("b",    { text: "No AI involved at this stage" }),
    h("span", { text: "Not walked through in Experience. What you wrote is kept — switch back to Yes and it returns." })));

  return wrap(h("div", { class: "check" },
    h("p", { class: "eyebrow", text: "AI check" }),
    h("h4", { text: "Is AI involved at this stage?" }),
    h("p", { text: "This answer decides what would walk through later. Only the stages you mark Yes carry through to Experience, where you trace what responsibility they expose." }),
    h("div", { class: "opts" },
      h("button", { class: "opt", onclick: () => setGate(s, true) },
        h("b", { text: "Yes" }),
        h("em", { text: "Opens the AI action, AI output and decision owner fields." })),
      h("button", { class: "opt", onclick: () => setGate(s, false) },
        h("b", { text: "No" }),
        h("em", { text: "Marks this stage as having no AI. It is still walked through in Experience, but nothing is retrieved there." })))));
}

/* one of the four sub-rows, for a stage whose gate is Yes */
function SubCell(s, ri) {
  if (ri === 0) return TextCell(s, "aiAction");
  if (ri === 1) return TextCell(s, "aiOutput");

  if (ri === 2) return h("div", { class: "cell" },
    h("div", { class: "cards three" }, DECISION.map(([v, txt, why, watch]) =>
      h("button", { class: "card" + (s.decisionOwner === v ? " on" : ""),
        onmousedown: e => { e.preventDefault();
          if (s.decisionOwner === v) return;
          s.decisionOwner = v; if (s.walked) s.dirty = true; render(); } },
        ...txt.split("\n").flatMap((l, i) => i ? [h("br"), l] : [l]),
        why ? h("span", { class: "tip" },
          h("b", { text: txt.replace("\n", " ") }), why,
          watch ? h("em", { text: watch }) : null) : null))));

  /* human intervention — its own gate, then free text or a closed state.
     the gate is descriptive. anything about failure belongs in Revise. */
  if (s.human === null) return h("div", { class: "cell" },
    h("div", { class: "check tight" + (nextField(s) === "humanGate" ? " focusnext" : "") },
      h("p",  { class: "eyebrow", text: "Human check" }),
      h("h5", { text: "Is a person involved at this stage?" }),
      h("p",  { class: "sub", text: "Someone the service provides — not a friend or a relative." }),
      h("div", { class: "yesno" },
        h("button", { class: "yn", onmousedown: e => { e.preventDefault(); setHuman(s, true); } }, "Yes"),
        h("button", { class: "yn", onmousedown: e => { e.preventDefault(); setHuman(s, false); } }, "No"))));

  if (s.human === false) return h("div", { class: "cell" },
    h("div", { class: "noai small" }, h("b", { text: "No one can step in at this stage" })));

  return TextCell(s, "humanIntervention");
}

function setGate(s, v)  { if (s.ai !== v)    { s.ai = v;    if (s.walked) s.dirty = true; }
  S.editing = null; render(); }
function setHuman(s, v) { if (s.human !== v) { s.human = v; if (s.walked) s.dirty = true; } render(); }

/* ─────────────────────────────────────────────────────────── menu */
function Menu() {
  const s = S.stages.find(x => x.key === S.menu.key);
  const i = S.stages.indexOf(s);
  const close = () => { S.menu = null; render(); };
  return h("div", { class: "scrim", style: "background:transparent", onclick: close },
    h("div", { class: "menu", style: `left:${S.menu.x}px;top:${S.menu.y}px`,
      onclick: e => e.stopPropagation() },
      h("button", { onclick: () => { close(); focusName(i); } }, "Rename"),
      h("button", { onclick: () => { S.stages.splice(i, 0, blankStage()); close(); } },
        "Insert a stage before this one"),
      h("hr"),
      h("button", { onclick: () => { S.modal = { type: "gate", key: s.key }; S.menu = null; render(); } },
        "Change AI involvement"),
      h("hr"),
      h("button", { class: "danger",
        onclick: () => { S.modal = { type: "delete", key: s.key }; S.menu = null; render(); } },
        "Delete this stage")));
}
function focusName(i) {
  setTimeout(() => { const el = document.querySelectorAll(".sname")[i]; if (el) { el.focus(); el.select(); } }, 0);
}

/* ─────────────────────────────────────────────────────────── modal */
function Modal() {
  const s = S.stages.find(x => x.key === S.modal.key);
  const i = S.stages.indexOf(s);
  const close = () => { S.modal = null; render(); };

  if (S.modal.type === "delete") return h("div", { class: "scrim", onclick: close },
    h("div", { class: "modal", onclick: e => e.stopPropagation() },
      h("h3", { text: `Delete stage ${String(i + 1).padStart(2, "0")}?` }),
      h("p",  { text: "Everything written in this stage goes with it." }),
      s.walked ? h("p", { text: "This stage was walked through in Experience. Any moments you kept there refer to it, so deleting the stage removes them from the report." }) : null,
      h("p",  { text: "The stages after it renumber. Nothing else changes — records refer to stages by name, not by number." }),
      h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => {
          S.stages.splice(i, 1);
          if (!S.stages.length) S.stages.push(blankStage());
          close();
        } }, "Delete the stage"),
        h("button", { class: "btn ghost", onclick: close }, "Cancel"))));

  return h("div", { class: "scrim", onclick: close },
    h("div", { class: "modal", onclick: e => e.stopPropagation() },
      h("h3", { text: "Is AI involved at this stage?" }),
      h("p",  { text: "This answer decides what would walk through later. Only the stages you mark Yes carry through to Experience." }),
      h("div", { class: "opts", style: "display:flex;flex-direction:column;gap:10px;margin-top:16px" },
        h("button", { class: "opt" + (s.ai === true ? " on" : ""),
          onclick: () => { setGate(s, true); close(); } },
          h("b", { text: "Yes" }), h("em", { text: "Opens the AI band for this stage." })),
        h("button", { class: "opt" + (s.ai === false ? " on" : ""),
          onclick: () => { setGate(s, false); close(); } },
          h("b", { text: "No" }), h("em", { text: "Marks this stage as having no AI. It is still walked through, but nothing is retrieved." }))),
      h("p", { class: "hint", text: "Switching to No keeps what you wrote here — switch back and it returns." }),
      s.walked ? h("p", { class: "warn", text: "This stage has already been walked through. Changing it will mark the stage as needing a re-walk." }) : null,
      h("div", { class: "row" }, h("button", { class: "btn ghost", onclick: close }, "Close"))));
}


/* ════════════════════════════════════════════════════════════════════
   EXPERIENCE — scripted.
   The moments, the quotes and the participants are real: every id below
   exists in evidence.json and every quote is rendered from it, never
   retyped here. What is scripted is the model's part — which moments
   come back for which stage, at what level on each dimension.
   The inference is written from that moment's own friction and
   consequence (PRD §5.1), not from anything outside the record.
   ════════════════════════════════════════════════════════════════════ */
const WALK = [
  { ids: ["M25","M26"], tier: "different service", read: [
      { id:"M25", dims:["same","partly","partly"],
        infer:"What is left out is not marked, so checking it means going back to the source. Only someone who already has the source can do that." },
      { id:"M26", dims:["same","partly","same"],
        infer:"An omission the user cannot detect is carried forward as if it were complete. Prior knowledge of the source is the only thing that would catch it." } ] },
  { ids: [], tier: null, read: [] },
  { ids: ["M09","M13","M20"], tier: "same kind of service", read: [
      { id:"M09", dims:["same","same","same"], tier:"same kind of service",
        infer:"Nothing here shows what the recommendation rests on, so the only check available is what the user already knows. Anyone without that knowledge has none." },
      { id:"M13", dims:["partly","partly","same"], tier:"different service",
        infer:"If the only thing on the screen is the institution's name, that is what the trust rests on. The output itself gives the user nothing to weigh." },
      { id:"M20", dims:["partly","different","same"], tier:"different service",
        infer:"With no way to check a single claim, a user may discount the whole output rather than judge it, and stop using this stage for the things that matter most." } ] },
];
const DIMNAME = ["Interaction","Output","User situation"];
const LEVELMARKS = { same:3, partly:2, different:1 };

/* the transcript window for M09 — speakers assigned by hand,
   the recording does not separate them (design doc §11.1) */
const TRANSCRIPT = {
  M09: { recorded:"28 April 2026", group:"Older adult · varying digital confidence",
    topic:"Everyday online tasks, and where support helps",
    turns:[
      ["i","Does this feel helpful or confusing or reassuring or frustrating?"],
      ["p","Totally helpful. Easy to access, no frustration."],
      ["i","Would you trust this enough to rely on, would you want to cheque something else?"],
      ["p","For something as simple as a cough, I would trust it. Yeah. So if it was something more serious. I think again, it comes down to whether or not, yeah, I mean, experienced."],
      ["p","I've lived a lot of life. I've got a good idea about lots of things. I would sense if the advice I'm reading doesn't quite make sense and actually I need to look further.","hit"],
      ["i","Good. It does the next task is, “Dear Siri, yeah.”"],
      ["p","Hey, Siri, can you remind me to visit the GP tomorrow morning?"],
      ["i","So, again. Which do you think this system is telling you to do?"],
      ["p","I found that interesting because that's a system I've never used before. I've asked him to remind me tomorrow morning. The information came up, he's going to remind me at 7am. I don't know yet whether or not I can trust it."],
    ] },
};

const EV = id => EVIDENCE.find(m => m.id === id) || null;
const aiStages = () => S.stages.filter(s => s.ai === true);
const walkFor = s => { const k = aiStages().indexOf(s); return k >= 0 ? (WALK[k] || {ids:[],read:[]}) : {ids:[],read:[]}; };

const WALK_MS = 1800;   /* keep in step with --walk */
function startExperience() {
  S.step = "experience";
  S.reached = Math.max(S.reached || 0, 1);
  S.exp = { i: 0, phase: null, m: 0, kept: {}, transcript: null };
  enterStage(0);
}
function enterStage(i) {
  const s = S.stages[i];
  S.exp.i = i; S.exp.m = 0; S.resetScroll = true;
  if (!s) { S.exp.phase = "done"; return render(); }
  if (s.ai !== true) { S.exp.phase = "noai"; return render(); }
  S.exp.phase = "searching"; render();
  setTimeout(() => {
    if (S.step !== "experience" || S.exp.phase !== "searching") return;
    S.exp.phase = walkFor(s).read.length ? "moments" : "none";
    render();
  }, WALK_MS);
}
function nextStage() {
  const i = S.exp.i + 1;
  if (i >= S.stages.length) { S.exp.phase = "done"; return render(); }
  enterStage(i);
}
const keptOf = s => (S.exp.kept[s.key] || []);
function decide(s, mid, keep) {
  const arr = keptOf(s).filter(x => x.id !== mid);
  arr.push({ id: mid, keep });
  S.exp.kept[s.key] = arr;
  const w = walkFor(s);
  if (S.exp.m < w.read.length - 1) { S.exp.m++; render(); }
  else { S.exp.phase = "reviewed"; render(); }
}

/* ── the journey rail ───────────────────────────────────────────────── */
function Rail() {
  const n = S.stages.length, cur = S.exp.i;
  const at = i => ((i + 0.5) / n) * 100;   /* the centre of that stage's column */

  /* the track runs dot to dot, not edge to edge, so it has a head and a
     tail. when the walkthrough moves on, the ink runs to the next dot
     instead of jumping there. */
  const prev  = (S.exp.railAt == null) ? cur : S.exp.railAt;
  const moved = prev !== cur;
  const head  = at(0), tail = 100 - at(n - 1);

  const walked = h("div", { class: "ln walked",
    style: `left:${head}%;right:${100 - at(moved ? prev : cur)}%` });
  const lane = h("div", { class: "raillane" },
    h("div", { class: "ln", style: `left:${head}%;right:${tail}%` }),
    walked);

  const dots = [];
  S.stages.forEach((s, i) => {
    const on = i <= (moved ? prev : cur);
    const dot = h("div", { class: "dot" + (on ? " on" : ""), style: `left:${at(i)}%` });
    dots[i] = dot;
    lane.appendChild(dot);
  });
  const mk = h("div", { class: "mk", style: `left:${at(moved ? prev : cur)}%` });
  lane.appendChild(mk);

  const chips = h("div", { class: "chips",
    style: `grid-template-columns:repeat(${n},1fr)` });
  const caps  = h("div", { class: "caps2",
    style: `grid-template-columns:repeat(${n},1fr)` });
  const chipEls = [];
  S.stages.forEach((s, i) => {
    const chip = h("div", { class: "chip" + (i === cur && !moved ? " now" : "") },
      h("span", { text: s.name || "Stage " + (i + 1) }),
      s.ai === true ? h("span", { class: "ai", text: "AI" }) : null);
    chipEls[i] = chip;
    chips.appendChild(chip);
    let txt = "", mark = false, dim = false;
    if (i > cur) { txt = ""; }
    else if (s.ai !== true) { txt = "no AI at this stage"; dim = true; }
    else {
      const w = walkFor(s), k = (S.exp.kept[s.key] || []).filter(x => x.keep).length;
      /* while the bar is still running, the count is not known yet — saying it
         here would answer the question the animation is asking. */
      if (i === cur && S.exp.phase === "searching") { txt = "searching…"; dim = true; }
      else if (!w.read.length) { txt = "no evidence found"; dim = true; }
      else if (i === cur && S.exp.phase !== "reviewed") txt = w.read.length + " moments";
      else { txt = w.read.length + " moments · " + k + " kept"; mark = k > 0; }
    }
    /* three states, and they have to look like three: searching (breathing,
       mid grey) → done, this stage (ink) → the stages behind it (mid grey).
       a stage that came back with nothing stays faint either way. */
    const busy = i === cur && S.exp.phase === "searching";
    caps.appendChild(h("div", { class: "cap"
        + (busy ? " searching" : dim ? " dim" : i === cur ? " now" : "") },
      mark ? h("i") : null, h("span", { text: txt })));
  });

  if (moved) {
    const span = Math.abs(at(cur) - at(prev)) || 1;
    for (let i = Math.min(prev, cur); i <= Math.max(prev, cur); i++) {
      const f = Math.abs(at(i) - at(prev)) / span;
      if (dots[i]) dots[i].style.transitionDelay = (f * WALK_MS / 1000).toFixed(2) + "s";
    }
    if (chipEls[cur]) chipEls[cur].style.transitionDelay = (WALK_MS * 0.72 / 1000) + "s";
    requestAnimationFrame(() => {
      walked.style.right = (100 - at(cur)) + "%";
      mk.style.left = at(cur) + "%";
      for (let i = Math.min(prev, cur); i <= Math.max(prev, cur); i++)
        if (dots[i]) dots[i].classList.toggle("on", i <= cur);
      if (chipEls[cur]) chipEls[cur].classList.add("now");
    });
  }
  S.exp.railAt = cur;

  return h("div", { class: "rail" }, lane, chips, caps,
    h("p", { class: "foot", text:
      "* Every stage is walked through, but only AI stages return evidence. A filled mark above shows a stage where you kept something." }));
}

/* ── the transcript ─────────────────────────────────────────────────── */
/* Every moment carries the surrounding passage it was taken from, so a
   transcript can be opened for any of them. Where a file was uploaded
   without speaker separation the lines are shown unattributed — that is
   the state of the material, not a gap in the view. Only the retrieved
   line is attributed, because the base declares whose it is. */
function transcriptOf(m) {
  if (TRANSCRIPT[m.id]) return TRANSCRIPT[m.id];
  const ctx = (m.context || "").trim();
  const q   = (m.quote   || "").trim();
  const at  = ctx.toLowerCase().indexOf(q.toLowerCase().slice(0, 40));
  const end = at < 0 ? -1 : at + q.length;

  const sents = ctx.match(/[^.?!]+[.?!]*\s*/g) || [ctx];
  const turns = [];
  let pos = 0, buf = [], bufAt = 0;
  const flush = hit => { if (buf.length) turns.push([hit ? "p" : "", buf.join(" ").trim(), hit]); buf = []; };
  sents.forEach(s => {
    const from = pos, to = pos + s.length; pos = to;
    const isHit = at >= 0 && from < end && to > at;
    if (isHit) { flush(false); turns.push(["p", s.trim(), true]); bufAt = 0; return; }
    buf.push(s.trim()); bufAt++;
    if (bufAt >= 2) { flush(false); bufAt = 0; }
  });
  flush(false);
  return { turns, group: "Older adult · varying digital confidence", source: m.source, plain: true };
}

        : "Anonymised — names, places and identifying detail are removed from everything in the base." }),
