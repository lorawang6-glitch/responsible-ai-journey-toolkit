/* ════════════════════════════════════════════════════════════════════
   REVISE — only what you kept comes here.
   The three lenses are fixed. They are questions, never findings:
   nothing is chosen for you, and more than one can apply.
   ════════════════════════════════════════════════════════════════════ */
const LENSES = [
  { key:"transparency", name:"Transparency",
    q:"How well can users understand why the AI made this particular recommendation or decision?",
    def:"Whether users know AI is involved, how the decision was made, and what it cannot do.",
    flip:"Flip to change the AI output", field:"aiOutput", fieldName:"AI output" },
  { key:"agency", name:"Agency",
    q:"Can users disagree with the outcome, or decline it, in a way that actually counts?",
    def:"Whether users can refuse the outcome, correct it, or say their case is different.",
    flip:"Flip to change the decision owner", field:"decisionOwner", fieldName:"Decision owner" },
  { key:"accountability", name:"Accountability",
    q:"When the AI gets this wrong here, who is responsible for that outcome?",
    def:"Whether someone answers when it goes wrong, and users have a real way to reach them.",
    flip:"Flip to change human intervention", field:"human", fieldName:"Human intervention" },
];

function startRevise() {
  const first = S.stages.findIndex(s => keptOf(s).some(x => x.keep));
  S.step = "revise";
  S.reached = Math.max(S.reached || 0, 2);
  S.rev = { i: first < 0 ? 0 : first, m: 0, open: null, changes: {} };
  S.resetScroll = true; render();
}
const changesOf = s => (S.rev.changes[s.key] || []);
function draftOf(key) { S.rev.draft = S.rev.draft || {};
  return (S.rev.draft[key] = S.rev.draft[key] || { text:"", owner:null, human:null }); }
function saveChange(s, lens, now) {
  const arr = changesOf(s).filter(c => c.lens !== lens.key);
  arr.push({ lens: lens.key, field: lens.field, fieldName: lens.fieldName,
             was: was(s, lens.field), now: now,
             moment: keptOf(s).filter(x => x.keep)[S.rev.m].id });
  S.rev.changes[s.key] = arr;
  s.dirty = true;
  S.rev.open = null; render();
}
function was(s, field) {
  if (field === "decisionOwner")
    return (DECISION.find(d => d[0] === s.decisionOwner) || [,"—"])[1].replace("\n", " ");
  if (field === "human")
    return s.human === false ? "No one can step in at this stage" : (s.humanIntervention || "—");
  return s[field] || "—";
}

function Revise() {
  const s = S.stages[S.rev.i];
  const kept = keptOf(s).filter(x => x.keep);
  const total = Object.values(S.rev.changes).flat().length;

  const list = h("div", { class: "stagelist" }, S.stages.map((st, i) => {
    const k = keptOf(st).filter(x => x.keep).length;
    const ch = changesOf(st).length;
    const dead = k === 0;
    const openRow = i === S.rev.i;
    const field = (lab, v) => [h("p", { class: "lab2", text: lab }), h("p", { class: "val", text: v })];
    const declared = [];
    if (openRow) {
      declared.push(h("p", { class: "hdlab", text: "As you declared it in Build" }));
      declared.push(...field("User action", st.userAction || "—"));
      if (st.ai === true) {
        declared.push(...field("AI action", st.aiAction || "—"));
        declared.push(...field("AI output", st.aiOutput || "—"));
        declared.push(...field("Decision owner", was(st, "decisionOwner")));
        declared.push(...field("Human intervention", was(st, "human")));
      } else declared.push(...field("AI involvement", "No AI at this stage"));
      declared.push(...field("User experience goal", st.goal || "—"));
    }
    return h("div", { class: "stagerow" + (dead ? " ahead" : "") },
      h("span", { class: "dot" }),
      h("button", { class: "srow" + (openRow ? " on" : "") + (dead ? " none" : ""),
      onclick: () => { if (!dead) { S.rev.i = i; S.rev.m = 0; S.rev.open = null; S.resetScroll = true; render(); } } },
      h("div", { class: "srhd" },
        h("div", { class: "nm" },
          h("span", { text: "Stage " + (i + 1) + " · " + (st.name || "—") }),
          st.ai === true ? h("span", { class: "ai", text: "AI" }) : null),
        h("div", { class: "st", text:
          st.ai !== true ? "No AI at this stage"
          : k === 0      ? "No evidence found · nothing kept"
          : k + (k === 1 ? " moment kept" : " moments kept") + (ch ? " · " + ch + " change" + (ch > 1 ? "s" : "") : "") })),
      openRow ? h("div", { class: "decl2" }, declared) : null));
  }));

  let right;
  if (!kept.length) right = h("div", { class: "state" },
    h("h4", { text: "There is nothing to work from here" }),
    h("p",  { text: s.ai !== true
      ? "You declared no AI at this stage, so nothing was retrieved."
      : "No matching moments in the evidence base for this stage. That is a gap in the base, not a verdict on the stage." }),
    h("p",  { class: "q", text: "Pick a stage on the left that kept something." }));
  else {
    const r = walkFor(s).read.find(x => x.id === kept[S.rev.m].id);
    const m = EV(kept[S.rev.m].id);
    right = h("div", {},
      h("div", { class: "mhead" },
        h("div", {},
          h("h4", { text: "Kept moment " + (S.rev.m + 1) + " of " + kept.length }),
          h("p",  { class: "cnt", text: "Stage " + (S.rev.i + 1) + " · " + (s.name || "—") })),
        h("div", { class: "nav" },
          h("button", { disabled: S.rev.m === 0,
            onclick: () => { S.rev.m--; S.rev.open = null; render(); } }, "‹"),
          h("button", { disabled: S.rev.m === kept.length - 1,
            onclick: () => { S.rev.m++; S.rev.open = null; render(); } }, "›"))),
      h("div", { class: "keptcard" },
        h("p", { class: "quote", text: "“" + m.quote + ".”" }),
        h("p", { class: "srcline" },
          m.id + "  ·  " + m.participant + "  ·  " + S.project.fit + " fit  ·  ",
          h("a", { href: "#", onclick: e => { e.preventDefault(); S.exp.transcript = m.id; render(); } },
            "Read the transcript →")),
        h("div", { class: "accepted" },
          h("p", { class: "lab", text: "You accepted this reading" }),
          h("p", { class: "infer", style: "margin-top:8px", text: r ? r.infer : "" }))),
      h("h4", { style: "margin:24px 0 4px;font-size:19px;font-weight:600;letter-spacing:-.01em",
        text: "What does this expose?" }),
      h("p", { style: "margin:0 0 14px;font-size:13.5px;color:var(--mute)",
        text: "Pick the lens that names what this exposes. The same three, every time — nothing here is chosen for you. More than one can apply." }),
      h("div", { class: "lenses" }, LENSES.map(L => Lens(s, L))),
      h("div", { style: "height:6px" }));
  }

  return h("div", { class: "wrap" }, h("div", { class: "frame" },
    h("div", { class: "rvtwo" },
      h("div", { class: "rvhead" },
        h("h3", { text: "Stages & kept moments" }),
        h("p",  { class: "sub", text: "Pick a stage. Ask what each kept moment exposes." })),
      h("div", { class: "rvhead ruled" },
          h("div", { class: "phdrrow", style: "margin:0" },
            h("div", {},
              h("h3", { style: "margin:0 0 4px", text: "Change requests" }),
              h("p",  { class: "sub", style: "margin:0", text: total
                ? total + (total === 1 ? " change requested." : " changes requested.") + " Nothing is applied yet."
                : "Nothing is applied to your design. These become requests in the report." })),
            /* going back is the step bar's job now — this row carries
               only the action that moves you on. */
            h("div", { style: "display:flex;gap:10px;flex:0 0 auto" },
              h("button", { class: "btn",
                onclick: () => { S.step = "fork"; S.resetScroll = true; render(); } },
                "Export the report")))),
      h("div", { class: "decl" }, list),
      h("div", { class: "work" },
        h("div", { class: "workscroll" }, h("div", { class: "rvbody" }, right))))));
}

function Lens(s, L) {
  const open = S.rev.open === L.key;
  const done = changesOf(s).find(c => c.lens === L.key);

  if (!open && !done) return h("button", { class: "lens",
    onclick: () => { S.rev.open = L.key; render(); } },
    h("div", {},
      h("h5", { text: L.name }),
      h("p", { class: "qq", text: L.q }),
      h("p", { class: "def" }, h("b", { text: "Definition" }), L.def)),
    h("p", { class: "flip" }, "\u21bb ", L.flip));

  if (done) return h("div", { class: "lens open" },
    h("div", {},
      h("h5", { text: L.name }),
      h("p", { class: "qq", text: L.q }),
      h("div", { class: "fieldbox" },
        h("p", { class: "lab", style: "margin:0 0 7px", text: L.fieldName }),
        h("div", { class: "was", text: done.was }),
        h("div", { class: "now", text: done.now }))),
    h("p", { class: "flip" }, "\u2713 requested \u2014 it will appear in the report"));

  /* opened. the toolkit shows what is there now and gives the designer
     somewhere to write what it should be. it does not propose the change. */
  const d = draftOf(L.key);
  const box = h("div", { class: "fieldbox" },
    h("p", { class: "lab", style: "margin:0 0 2px", text: L.fieldName }));
  const go = h("button", { class: "btn", style: "margin-top:14px;align-self:flex-start", disabled: true },
    "Request this change");
  const ready = v => { go.disabled = !v; };

  if (L.field === "aiOutput") {
    const ta = h("textarea", { class: "rvtext", rows: 3,
      placeholder: "What should the user see instead?" });
    ta.value = d.text;
    ta.addEventListener("input", e => { d.text = e.target.value; ready(e.target.value.trim()); });
    box.appendChild(ta);
    ready(d.text.trim());
    go.addEventListener("click", () => saveChange(s, L, d.text.trim()));
  }

  else if (L.field === "decisionOwner") {
    const opts = h("div", { class: "rvopts" });
    DECISION.forEach(([v, txt]) => {
      const cur = s.decisionOwner === v;
      const b = h("button", { class: "rvopt" + (d.owner === v ? " on" : "") + (cur ? " cur" : "") },
        txt.replace("\n", " "), cur ? h("span", { class: "curtag", text: "now" }) : null);
      b.addEventListener("click", () => { d.owner = v; render(); });
      opts.appendChild(b);
    });
    box.appendChild(h("p", { class: "ask", text: "Who should own the decision instead?" }));
    box.appendChild(opts);
    ready(d.owner && d.owner !== s.decisionOwner);
    go.addEventListener("click", () => saveChange(s, L,
      (DECISION.find(x => x[0] === d.owner) || [,""])[1].replace("\n", " ")));
  }

  else {
    box.appendChild(h("p", { class: "ask", text: "Should a person be involved here?" }));
    const yn = h("div", { class: "rvopts two" });
    [["yes", "Yes"], ["no", "No"]].forEach(([v, lab]) => {
      const b = h("button", { class: "rvopt" + (d.human === v ? " on" : "") }, lab);
      b.addEventListener("click", () => { d.human = v; render(); });
      yn.appendChild(b);
    });
    box.appendChild(yn);
    if (d.human === "yes") {
      const ta = h("textarea", { class: "rvtext", rows: 2,
        placeholder: "Who steps in, and under what conditions?" });
      ta.value = d.text;
      ta.addEventListener("input", e => { d.text = e.target.value; ready(e.target.value.trim()); });
      box.appendChild(ta);
      ready(d.text.trim());
      go.addEventListener("click", () => saveChange(s, L, d.text.trim()));
    } else if (d.human === "no") {
      ready(true);
      go.addEventListener("click", () => saveChange(s, L, "No one can step in at this stage"));
    }
  }

  return h("div", { class: "lens open" },
    h("div", {}, h("h5", { text: L.name }), h("p", { class: "qq", text: L.q }), box),
    h("div", {}, go,
      h("p", { class: "flip", style: "padding-top:12px;font-size:11.5px;color:var(--faint)",
        text: "Writes back to the stage and marks it “changed — not yet re-walked”." })));
}


/* ── every kept moment dealt with: re-walk, or export as it stands ─── */
function Fork() {
  const rows = [];
  S.stages.forEach((s, i) => {
    const ch = changesOf(s);
    const kept = keptOf(s).filter(x => x.keep).length;
    if (ch.length) ch.forEach(c => rows.push(
      { st: i + 1, what: c.fieldName + " changed", tag: "not yet re-walked" }));
    else if (kept) rows.push(
      { st: i + 1, what: "Accepted, design left as declared", tag: "no change", quiet: true });
    else if (s.ai === true) rows.push(
      { st: i + 1, what: "No matching moments in the evidence base",
        tag: "nothing in the base", quiet: true });
  });
  const dealt = S.stages.reduce((n, s) => n + keptOf(s).filter(x => x.keep).length, 0);
  const changed = S.stages.filter(s => changesOf(s).length);

  return h("div", { class: "wrap" },
    h("div", { class: "frame panel", style: "overflow-y:auto" },
      h("div", { class: "fork" },
        h("h3", { text: "Every kept moment has been dealt with" }),
        h("p", { class: "lede", text: dealt + " of " + dealt + " items processed. Nothing has been re-walked yet — what you changed is a request until the base is asked again." }),
        h("div", { class: "ledger" }, rows.map(r =>
          h("div", { class: "r" + (r.quiet ? " quiet" : "") },
            h("b", { text: "Stage " + r.st }),
            h("span", { text: r.what }),
            h("span", { class: "tag", text: r.tag })))),
        h("div", { class: "forkq" },
          h("p", { class: "cap", text: "The only question the toolkit has no position on" }),
          h("h3", { text: "Re-walk the changed stages?" }),
          h("p", { class: "lede", style: "margin-bottom:0", text:
            "A re-walk may return the same moments, different ones, or none at all. The report is produced either way, and re-walking adds a second round to it." }),
          h("div", { class: "forkbtns" },
            h("button", { class: "btn ghost", disabled: !changed.length,
              onclick: () => {
                const i = S.stages.indexOf(changed[0]);
                S.step = "experience"; S.resetScroll = true; enterStage(i);
              } }, "Re-walk the changed stages"),
            h("button", { class: "btn ghost",
              onclick: () => { S.step = "report"; S.resetScroll = true; render(); } },
              "Export without re-walking"))))));
}

/* ════════════════════════════════════════════════════════════════════
   THE REPORT — generated from what actually happened.
   Every quote is rendered from EVIDENCE by id, so a quote that was never
   retrieved cannot appear here. The silences are stated, not left blank.
   ════════════════════════════════════════════════════════════════════ */
function Report() {
  const n = S.stages.length;
  const allChanges = S.stages.flatMap(s => changesOf(s).map(c => ({ s, c })));
  const cols = `grid-template-columns:150px repeat(${n},minmax(190px,1fr))`;
  const g = h("div", { class: "rtable", style: cols });

  /* column heads — a stage that carries changes says so here */
  g.appendChild(h("div", { class: "rh" }));
  S.stages.forEach((s, i) => {
    const ch = changesOf(s).length;
    g.appendChild(h("div", { class: "rh" },
      h("span", { class: "num", text: String(i + 1).padStart(2, "0") }),
      h("span", { class: "nm",  text: s.name || "—" }),
      ch ? h("span", { class: "chgtag", text: ch + (ch === 1 ? " CHANGE" : " CHANGES") }) : null));
  });

  const band = lab => g.appendChild(h("div", { class: "rband", text: lab }));
  const row = (lab, get, field) => {
    g.appendChild(h("div", { class: "rl2", text: lab }));
    S.stages.forEach(s => {
      const c = field ? changesOf(s).find(x => x.field === field) : null;
      const v = get(s);
      g.appendChild(h("div", { class: "rc" + (v === "—" ? " dash" : "") + (c ? " changed" : "") },
        h("p", { class: "rv", text: v }),
        c ? h("p", { class: "chgmark", text: "Change requested" }) : null));
    });
  };

  band("Build");
  row("User action",        s => s.userAction || "—");
  row("AI involved?",       s => s.ai === true ? "Yes" : s.ai === false ? "No" : "—");
  row("AI action",          s => s.ai === true ? (s.aiAction || "—") : "—");
  row("AI output",          s => s.ai === true ? (s.aiOutput || "—") : "—", "aiOutput");
  row("Decision owner",     s => s.ai === true ? was(s, "decisionOwner") : "—", "decisionOwner");
  row("Human intervention", s => s.ai === true ? was(s, "human") : "—", "human");
  row("Experience goal",    s => s.goal || "—");

  band("Experience");
  row("The base returned", s => {
    if (s.ai !== true) return "no AI — nothing retrieved";
    const w = walkFor(s); if (!w.read.length) return "nothing in the base";
    const k = keptOf(s).filter(x => x.keep).length;
    return w.read.length + " returned · " + k + " kept";
  });
  row("Moments you kept", s => {
    const k = keptOf(s).filter(x => x.keep);
    if (!k.length) return "—";
    return k.map(x => { const m = EV(x.id);
      return "“" + m.quote + ".”\n" + m.id + " · " + m.participant; }).join("\n\n");
  });
  row("What you accepted", s => {
    const k = keptOf(s).filter(x => x.keep);
    if (!k.length) return "—";
    const w = walkFor(s);
    return k.map(x => (w.read.find(r => r.id === x.id) || {}).infer).filter(Boolean).join("\n\n") || "—";
  });

  band("Revise");
  row("What you decided", s => {
    if (s.ai !== true) return "—";
    if (!keptOf(s).filter(x => x.keep).length) return "—";
    const ch = changesOf(s);
    return ch.length ? ch.length + (ch.length === 1 ? " change requested — " : " changes requested — ")
                        + ch.map(c => c.fieldName.toLowerCase()).join(" · ")
                     : "No change — design left as declared";
  });

  const silences = S.stages.map((s, i) => {
    if (s.ai !== true) return "Stage " + (i + 1) + " — no AI; walked through, nothing retrieved.";
    if (!walkFor(s).read.length)
      return "Stage " + (i + 1) + " — no one in the base was in the situation you declared. This is a gap in the base, not a verdict on the stage.";
    const rej = keptOf(s).filter(x => !x.keep).length;
    return rej ? "Stage " + (i + 1) + " — " + rej + " reading" + (rej > 1 ? "s" : "") + " set aside, with your reason."
               : null;
  }).filter(Boolean);

  /* how far the moment behind a change actually matched */
  const fitLine = (s, c) => {
    const w = walkFor(s), r = (w.read || []).find(x => x.id === c.moment);
    if (!r) return "";
    const hit = r.dims.filter(d => d !== "different").length;
    const tier = r.tier || w.tier || "";
    return "retrieved on " + hit + " of 3 dimensions" + (tier ? " — " + tier : "");
  };

  return h("div", { class: "wrap" },
    h("div", { style: "display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px;flex:0 0 auto" },
      h("div", {},
        h("h2", { class: "phdr", style: "font-size:26px", text: "The report" }),
        h("p",  { class: "phdrsub", text: "Nothing here was written by the AI." })),
      h("div", { class: "rtop" },
        h("button", { class: "btn", text: "Download PDF" }),
        h("button", { class: "btn ghost", text: "Save and exit",
          onclick: () => { S.step = "fork"; S.resetScroll = true; render(); } }))),

    h("div", { class: "sheet" },
      h("p", { class: "lab", text: "Responsible AI Journey Toolkit  ·  Change requests" }),
      h("h2", { text: (S.project.name.trim() ||
        (S.stages.map(s => s.name).filter(Boolean)[0] || "Untitled")) }),
      h("p", { class: "meta", text:
        new Date().toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" }) +
        "  ·  provided evidence base: 8 interviews, older adults using public services" +
        "  ·  evidence fit declared " + S.project.fit.toLowerCase() +
        "  ·  one round, not yet re-walked" }),

      g,
      h("p", { class: "rnote", text:
        "Shaded cells are where a change is requested. Nothing is marked where evidence was kept but no change was made — that is a decision, not an omission." }),

      h("section", {},
        h("h3", { text: allChanges.length
          ? (allChanges.length === 1 ? "The one change in full" : "The " + allChanges.length + " changes in full")
          : "No changes requested" }),
        allChanges.length ? allChanges.map(({ s, c }) => {
          const m = EV(c.moment);
          return h("div", { class: "chg" },
            h("p", { class: "hd", text: "Stage " + (S.stages.indexOf(s) + 1) + "  ·  " + c.fieldName }),
            h("div", { class: "ba" },
              h("div", {}, h("p", { class: "k", text: "Now" }), h("p", { class: "v was", text: c.was })),
              h("div", { class: "arrow", text: "→" }),
              h("div", {}, h("p", { class: "k", text: "Requested" }),
                h("p", { class: "v", text: c.now + " — offered, not applied" }))),
            m ? h("blockquote", { text: "“" + m.quote + ".”" }) : null,
            m ? h("p", { class: "cite", text: m.id + "  ·  " + m.participant + "   ·   " + fitLine(s, c) }) : null);
        }) : h("p", { style: "font-size:13px;color:var(--mute)",
          text: "You kept evidence but asked for no change. That is a decision, and it is recorded as one." })),

      h("section", {},
        h("h3", { text: "What this does not cover" }),
        h("div", { class: "gap" },
          silences.map(t => h("p", { text: t })),
          h("p", { style: "margin-top:12px" },
            h("b", { text: "No stage was graded." }),
            " Friction is reported where evidence was kept. Its absence is never reported — an empty row above means the base held nothing for that stage, not that the stage was checked and found sound.")))));
}

window.addEventListener("beforeunload", e => {
  if (S.stages.some(started)) { e.preventDefault(); e.returnValue = ""; }
});
render();
</script>
</body>
</html>
